<div class="payment-method" data-bind="attr: {id: getCode()+'-payment'}, css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice payment-heading paypal-amazon-heading">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()">
        <label data-bind="attr: {'for': getCode(), class: getCode()+'-label'}" class="label">
            Express checkout
            <span>
                <img data-bind="attr: {src: require.toUrl('Dcw_PaymentMethods/images/paypal-express-2.png'), alt: $t('Acceptance Mark')}"
                class="payment-icon"/>
                <img data-bind="attr: {src: require.toUrl('Dcw_PaymentMethods/images/amazon-pay-2.png'), alt: $t('Acceptance Mark')}"
                class="payment-icon"/>
            </span>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <fieldset class="fieldset" data-bind='attr: {id: "payment_form_" + getCode()}'>
            <div class="payment-method-note">
                <!-- ko i18n: 'You will be redirected to the PayPal website.' --><!-- /ko -->
            </div>
            <!-- ko template: 'Magento_Paypal/payment/express/billing-agreement' --><!-- /ko -->
        </fieldset>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="payment-method-extra-content">
            <each args="$parent.getRegion('paypal-method-extra-content')" render=""></each>
        </div>
        <div class="actions-toolbar">
            <button class="action primary checkout">
                <img data-bind="attr: {src: require.toUrl('Dcw_PaymentMethods/images/paypal-btn.png'), alt: $t('Acceptance Mark')},
                i18n: 'Continue to PayPal', click: function () { validate() && continueToPayPal() }"
                class="payment-icon"/>
            </button>
        </div>
    </div>
</div>
