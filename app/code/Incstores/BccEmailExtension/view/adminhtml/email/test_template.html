TEST FILE - Created for testing BccEmailExtension - Safe to delete
Email template for BCC Email Extension test emails
-->
<!--@subject BCC Email Extension Test Email (TEST) @-->
<!--@vars {
"var message":"Test message content",
"var to_email":"Recipient email address"
} @-->

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCC Email Extension Test</title>
</head>
<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <tr>
            <td style="padding: 30px;">
                <h1 style="font-size: 22px; font-weight: bold; margin: 0 0 20px 0; color: #333;">BCC Email Extension Test</h1>
                <p style="margin: 0 0 10px 0; color: #333;"><strong>This is a test email from the BCC Email Extension.</strong></p>
                <p style="margin: 0 0 10px 0; color: #666;">Recipient: {{var to_email}}</p>
                <div style="background: #f5f5f5; border-left: 4px solid #1979c3; padding: 15px; margin: 20px 0;">
                    <p style="margin: 0 0 10px 0; font-weight: bold; color: #333;">Test Message:</p>
                    <p style="margin: 0; white-space: pre-wrap; color: #333;">{{var message}}</p>
                </div>
                <p style="margin: 20px 0 10px 0; font-size: 12px; color: #666;">
                    <em>Note: This email should also be BCC'd to the configured addresses (chris.boyce@incstores.com, trashcan@boycecentral.com) via the BccEmailExtension plugin.</em>
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
