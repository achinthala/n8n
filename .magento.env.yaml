stage:
  global:
    SCD_ON_DEMAND: true
    CLEAN_STATIC_FILES: true
  build:
    SKIP_SCD: false
    SCD_STRATEGY: "compact"
    SCD_THREADS: 4
    QUALITY_PATCHES:
      - ACSD-48234
      - ACSD-48857
      - MDVA-12304
      - ACSD-51431
      - ACSD-54989
      - ACSD-46767
      - ACSD-53239
      - ACSD-52906
      - ACSD-51636
      - ACSD-47666
      - ACSD-51041
      - ACSD-47054
      - ACSD-53728
      - ACSD-53795
      - ACSD-53347
      - ACSD-55414
      - ACSD-62577
      - ACSD-53583
      - ACSD-56193
      - ACSD-63244
      - ACSD-62670
  deploy:
    MYSQL_USE_SLAVE_CONNECTION: true
    VALKEY_USE_SLAVE_CONNECTION: true
    VALKEY_BACKEND: \Magento\Framework\Cache\Backend\RemoteSynchronizedCache
    CACHE_CONFIGURATION:
      _merge: true
      default:
        backend_options:
          use_stale_cache: true
      stale_cache_enabled:
        backend_options:
          use_stale_cache: true
      type:
        default:
          frontend: "default"
        layout:
          frontend: "stale_cache_enabled"
        block_html:
          frontend: "stale_cache_enabled"
        reflection:
          frontend: "stale_cache_enabled"
        config_integration:
          frontend: "stale_cache_enabled"
        config_integration_api:
          frontend: "stale_cache_enabled"
        full_page:
          frontend: "stale_cache_enabled"
        translate:
          frontend: "stale_cache_enabled"
      frontend:
        default:
          id_prefix: '061_'
          backend_options:
            read_timeout: 10
            connect_retries: 5
            preload_keys: 
              - '061_EAV_ENTITY_TYPES:hash'
              - '061_GLOBAL_PLUGIN_LIST:hash'
              - '061_DB_IS_UP_TO_DATE:hash'
              - '061_SYSTEM_DEFAULT:hash'
    SESSION_CONFIGURATION:
      _merge: true
      redis:
        timeout: 5
        disable_locking: 1
        bot_first_lifetime: 60
        bot_lifetime: 7200
        max_lifetime: 2592000
        min_lifetime: 60
    CRON_CONSUMERS_RUNNER:
      cron_run: true
      max_messages: 1000
      consumers:
        - exportProcessor
        - sales.rule.update.coupon.usage
        - product_alert
        - async.operations.all
  post-deploy:
    WARM_UP_CONCURRENCY: 4
    WARM_UP_PAGES:
      - "index.php"
      - "category:*:1"
      - "category:*:store1|store2"
      - "cms-page:contact:*"
      - "product:*:*"
      - "product:*:store1"
      - "store-page:/contact-us:*"
      - "store-page:/contact-us:1"